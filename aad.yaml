monitoredService:
  orgIdentifier: tt1
  projectIdentifier: aa
  identifier: abb1_local_k3d_env
  name: abb1_local_k3d_env
  type: Application
  description: ""
  serviceRef: abb1
  environmentRef: local_k3d_env
  environmentRefList:
  - local_k3d_env
  sources:
    healthSources:
    - name: prom11
      identifier: prom11
      type: Prometheus
      spec:
        connectorRef: promt1
        metricPacks:
        - identifier: Custom
          metricThresholds:
          - groupName: gn
            metricName: Prometheus Metric
            metricIdentifier: prometheus_metric
            metricType: Custom
            spec:
              action: FailImmediately
              spec: {}
            criteria:
              type: Absolute
              spec:
                greaterThan: 3.0
            type: FailImmediately
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: OTHER
            riskCategory: Performance_Other
            thresholdTypes:
            - ACT_WHEN_HIGHER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: code
            riskProfile:
              category: Performance
              metricType: OTHER
              riskCategory: Performance_Other
              thresholdTypes:
              - ACT_WHEN_HIGHER
          sli:
            enabled: false
          query: "max(\n\tcpu_usage_ratio\t{\n\n\t\tenv=\"env\",\n\t\tbranch=\"HEAD\"\
            ,\n\t\tenv=\"env\"\n\n})"
          groupName: gn
          serviceInstanceFieldName: code
          prometheusMetric: cpu_usage_ratio
          serviceFilter:
          - labelName: env
            labelValue: env
          envFilter:
          - labelName: env
            labelValue: env
          - labelName: branch
            labelValue: HEAD
          aggregation: max
          isManualQuery: false
  enabled: false
